# Set local serials and gains for your hardware; these examples do not select a bench device.
schema_version: 2
profile: ../profiles/generic-2fsk-v5.yaml
node_id: 2
peer_id: 1
timing_role: follower
operation: bidirectional
input_kind: payload
hardware:
  device:
    type: b200
  tx_gain: 0
  rx_gain: 0
  tx_antenna: TX/RX
  rx_antenna: RX2
runtime:
  decoder_worker_enabled: true
  hardware_timed_io: true
  hardware_timed_tx_lead_seconds: 0.01
  queue_size: 256
endpoint:
  bind_host: 127.0.0.1
  bind_port: 50010
  destination_host: 127.0.0.1
  destination_port: 50011
status:
  output: text
  http_port: 8766
authentication:
  private_key_file: keys/peer-b-private.pem
  public_key_files:
    1: keys/peer-a-public.pem
    2: keys/peer-b-public.pem
  replay_state_file: state/peer-b-replay.json
