# X310 conducted diagnostic profile: crossed TX/RX -> 30 dB -> other RX2.
# Shared-device launch required for this pair; reliable-link backlog remains unqualified.
authentication:
  private_key_file: keys/peer-b-private.pem
  public_key_files:
    1: keys/peer-a-public.pem
    2: keys/peer-b-public.pem
  replay_state_file: state/peer-b-replay.json
endpoint:
  bind_host: 127.0.0.1
  bind_port: 50200
  destination_host: 127.0.0.1
  destination_port: 50201
error_correction:
  bit_repetitions: 1
  interleaver_depth: 16
  rs_parity_bytes: 0
  scheme: extended-hamming-8-4
link:
  ack_timeout_seconds: 0.25
  control_queue_size: 32
  hardware_clock_sync: true
  hardware_min_tx_lead_seconds: 0.002
  hardware_sync_tx_lead_seconds: 0.02
  hardware_timed_io: true
  max_retries: 4
  queue_size: 256
  tdd_follower_bursts_per_slot: 8
  tdd_guard_seconds: 0.002
  tdd_inter_burst_seconds: 0.002
  tdd_leader_bursts_per_slot: 8
  tdd_period_seconds: 0.18
modem:
  bit_rate_bps: 250000
  decoder_worker_enabled: true
  modulation: bpsk
node_id: 2
packet:
  format: generic-v5
  max_payload_bytes: 1024
peer_id: 1
radio:
  bandwidth_hz: 1000000
  center_frequency_hz: 915000000
  channel: 1
  device:
    addr: 192.168.10.2
    type: x300
  rx_antenna: RX2
  rx_gain_db: 0
  sample_rate_hz: 2000000
  tx_antenna: TX/RX
  tx_gain_db: 0
schema_version: 1
status:
  http_host: 127.0.0.1
  http_port: 8766
  output: text
timing_role: follower
