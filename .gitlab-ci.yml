stages:
  - quality
  - test
  - security
  - package

default:
  interruptible: true
  cache:
    key: "pip-${CI_JOB_IMAGE}"
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

quality:
  stage: quality
  image: python:3.13
  before_script:
    - python -m pip install -e ".[dev]"
  script:
    - ruff format --check .
    - ruff check .
    - mypy packet_radio

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  image: "python:${PYTHON_VERSION}"
  before_script:
    - python -m pip install -e ".[dev]"
  script:
    - pytest --cov=packet_radio --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

dependency-audit:
  stage: security
  image: python:3.13
  before_script:
    - python -m pip install -e ".[dev]"
  script:
    - pip-audit .

package:
  stage: package
  image: python:3.13
  before_script:
    - python -m pip install -e ".[dev]"
  script:
    - python -m build
    - twine check dist/*
    - python -m pip install --force-reinstall --no-deps dist/packet_radio-1.1.0-py3-none-any.whl
    - python -m venv /tmp/packet-radio-release
    - /tmp/packet-radio-release/bin/python -m pip install --force-reinstall dist/packet_radio-1.1.0-py3-none-any.whl
    - cd /tmp
    - /tmp/packet-radio-release/bin/python /tmp/packet-radio-release/share/packet-radio/tools/check_install.py
  artifacts:
    paths:
      - dist/
