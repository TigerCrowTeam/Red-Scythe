[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-radio"
version = "1.1.0"
description = "A general-purpose packet radio using direct Ettus UHD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "numpy>=1.23", "PyYAML>=6.0", "reedsolo>=1.7"]

[project.optional-dependencies]
ui = ["textual>=8.2.8,<8.3"]
test = ["pytest>=7"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=5.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
packet-radio-payload = "packet_radio.cli.payload_cli:main"
packet-radio = "packet_radio.__main__:main"
packet-radio-status = "packet_radio.cli.status_cli:main"
packet-radio-validate = "packet_radio.cli.validate:main"
packet-radio-replay = "packet_radio.cli.replay:main"
packet-radio-keys = "packet_radio.cli.key_cli:main"
packet-radio-conformance = "packet_radio.cli.conformance:main"
packet-radio-ui = "packet_radio.cli.ui:main"

[tool.setuptools.packages.find]
include = ["packet_radio*"]

[tool.setuptools.data-files]
"share/packet-radio/fixtures" = ["fixtures/protocol_v5.json"]
"share/packet-radio" = ["README.md", "MODULATION_RESULTS.md"]
"share/packet-radio/docs" = ["docs/*.md"]
"share/packet-radio/configs/examples" = ["configs/examples/*.yaml"]
"share/packet-radio/configs/bench" = ["configs/bench/*.yaml"]
"share/packet-radio/configs/profiles" = ["configs/profiles/*.yaml"]
"share/packet-radio/configs/v1_1" = ["configs/v1_1/*.yaml"]
"share/packet-radio/tools" = ["tools/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["packet_radio"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["packet_radio"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
no_site_packages = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["uhd"]
ignore_missing_imports = true
